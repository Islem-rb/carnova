spring.application.name=carnova
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carnova}
spring.datasource.username=${DATABASE_USER:carnova}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=45MB
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.jackson.time-zone=Africa/Tunis
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration=${JWT_EXPIRATION_SECONDS:3600}
app.cors-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
app.uploads-dir=${UPLOADS_DIR:uploads}
app.models-dir=${MODELS_DIR:models}
app.demo-data=${DEMO_DATA:false}
app.payments-mode=${PAYMENTS_MODE:mock}
app.stripe-secret=${STRIPE_SECRET_KEY:}
app.stripe-public=${STRIPE_PUBLISHABLE_KEY:}
app.ollama-url=${OLLAMA_URL:}
app.ollama-model=${OLLAMA_MODEL:llama3.2}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.root=INFO
# A single header the trusted proxy overwrites with the visitor IP (X-Real-IP behind the bundled
# Nginx, CF-Connecting-IP on Render). Empty: socket address.
app.client-ip-header=${CLIENT_IP_HEADER:}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml

# Render sets RENDER_EXTERNAL_URL to the public https origin of the service.
app.frontend-url=${FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
app.mailpit-url=${MAILPIT_URL:http://localhost:8025}
# false on hosted demos without a mail service: account links are then never sent.
app.mail-enabled=${MAIL_ENABLED:true}
app.mail-from=${MAIL_FROM:bonjour@carnova.test}
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
