spring.application.name=carnova
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carnova}
spring.datasource.username=${DATABASE_USER:carnova}
spring.datasource.password=${DATABASE_PASSWORD:local-development-only}
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}
stripe.secret.key=${STRIPE_SECRET_KEY:}
